name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project dependencies and tooling
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install \
            "ruff==0.16.2" \
            "black==26.5.1" \
            "isort==9.0.0b2" \
            "pytest==9.1.1"

      - name: Run ruff
        run: |
          ruff check .

      - name: Run black (check)
        run: |
          black --check .

      - name: Run isort (check)
        run: |
          isort --check-only .

      - name: Run tests
        run: |
          pytest -q
